<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tallyo mobile Items — design reference</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1e293b;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}h1,h2,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:default}svg{width:20px;height:20px;stroke-width:1.8;flex-shrink:0}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}.app{width:100%;min-height:100dvh;display:flex;flex-direction:column}.topbar{height:62px;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}.brand{width:119px;height:50px;object-fit:contain;margin-left:-3px}.more{height:44px;min-width:69px;color:#cbd5e1;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;border-radius:8px}.more svg{width:18px;height:18px}.main{padding:15px 18px 18px;flex:1}.heading{display:flex;align-items:center;gap:8px;margin-bottom:16px}.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-9px;color:#77869e}.heading h1{font-size:24px;letter-spacing:-.6px;font-weight:650}.heading p{font-size:12px;color:#8290a6;margin-top:4px}.count{margin-left:auto;font-size:12px;color:#8795aa}.item-card{background:#fff;border:1px solid #dfe6ef;border-radius:11px;overflow:hidden;box-shadow:0 2px 3px #0f172a02}.item-card+.item-card{margin-top:10px}.item-card[open]{border-color:#cfd5ef;box-shadow:0 0 0 1px #eef0fa}.item-card summary{list-style:none;display:flex;align-items:center;gap:9px;min-height:62px;padding:13px 14px;cursor:default}.item-card summary::-webkit-details-marker{display:none}.summary-text{flex:1;min-width:0}.item-name{font-size:15px;font-weight:600;display:block;color:#3d4c64}.item-meta{font-size:12px;color:#8190a6;display:block;margin-top:5px}.summary-total{font-size:16px;letter-spacing:-.25px;font-weight:650;color:#43526a;white-space:nowrap}.item-card[open] .summary-total,.item-card[open] .item-meta{display:none}.expand-arrow{width:17px;height:17px;color:#98a5bb}.item-card[open] .expand-arrow{transform:rotate(180deg)}.item-card[open] summary{border-bottom:1px solid #e9edf6;min-height:48px;padding-block:10px}.editing{display:none;font-size:11px;font-weight:500;color:#6f79ae;margin-right:3px}.item-card[open] .editing{display:inline}.item-body{padding:13px 14px 8px}.field label{display:block;font-size:12px;color:#728099;font-weight:500;margin-bottom:6px}.field input,.field textarea,.field select{display:block;border:1px solid #dce3ee;background:#fff;border-radius:7px;width:100%;min-width:0;height:44px;padding:9px;font-size:15px;outline-offset:1px}.field textarea{height:59px;resize:none;line-height:1.35;font-size:14px;padding-top:9px}.fields{display:grid;grid-template-columns:64px 102px minmax(0,1fr);gap:9px;margin-top:13px}.money-input{position:relative}.money-input span{position:absolute;left:9px;top:12px;font-size:14px;color:#8492a7}.money-input input{padding-left:24px}.tax-total{display:grid;grid-template-columns:78px 1fr;gap:15px;margin-top:13px;align-items:end}.tax-input{position:relative}.tax-input span{position:absolute;right:10px;top:13px;color:#8b98aa;font-size:13px}.tax-input input{padding-right:24px}.line-total{text-align:right;padding-bottom:4px}.line-total span{display:block;color:#7b8aa1;font-size:12px;margin-bottom:7px}.line-total strong{font-size:23px;letter-spacing:-.4px;font-weight:650;color:#36465f;font-variant-numeric:tabular-nums}.item-tools{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f5;margin-top:13px}.discount{min-height:44px;min-width:110px;display:flex;gap:6px;align-items:center;font-size:12px;color:#7e8da3;padding:0}.discount svg{width:13px;height:13px}.remove{min-height:44px;min-width:78px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0;font-size:12px;color:#b66c62}.remove svg{height:14px;width:14px}.add-actions{display:flex;flex-direction:column;gap:8px;margin-top:13px}.add{height:44px;width:100%;display:flex;justify-content:center;align-items:center;gap:8px;border:1px dashed #cbd5e5;background:#fafbfe;border-radius:8px;font-size:14px;font-weight:550;color:#657594}.add svg{height:16px;width:16px}.products{height:44px;width:100%;display:flex;justify-content:center;align-items:center;gap:7px;border:1px solid #dce2f5;background:#eef1fe;border-radius:8px;color:#4f46e5;font-size:13px;font-weight:550}.products svg{height:16px;width:16px}.totals{background:white;border:1px solid #dfe6ef;border-radius:10px;padding:12px 14px;margin-top:15px}.total-row{display:flex;align-items:center;justify-content:space-between;color:#76859b;font-size:13px;line-height:1.4}.total-row strong{color:#3e4d65;font-weight:600;font-variant-numeric:tabular-nums}.total-row+.total-row{margin-top:8px}.total-row.grand{border-top:1px solid #e8edf4;padding-top:10px;margin-top:10px;color:#435269;font-weight:600}.total-row.grand strong{font-size:21px;color:#4f46e5;letter-spacing:-.4px}.total-row small{font-size:11px;color:#8b98ab}.footer{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid #dce3ee;padding:12px 18px 16px;box-shadow:0 -3px 12px #0f172a03;flex-shrink:0}.done{width:100%;height:48px;background:#4f46e5;border:1px solid #4f46e5;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:15px;font-weight:600}.done svg{width:17px;height:17px}@media(max-width:360px){.main{padding-inline:14px}.fields{grid-template-columns:57px 93px minmax(0,1fr);gap:7px}.field input,.field select{font-size:14px;padding-inline:7px}.money-input input{padding-left:22px}.item-body{padding-inline:12px}.products{font-size:12px}}
</style></head><body><div class="app"><header class="topbar"><img class="brand" src="../../../tallyo-wordmark-white.png" alt="Tallyo"><button class="more" aria-label="More invoice actions">More<i data-lucide="ellipsis"></i></button></header>
<main class="main"><div class="heading"><button class="back" aria-label="Back to invoice sections"><i data-lucide="arrow-left"></i></button><div><h1>Items</h1><p>Invoice INV-1042</p></div><span class="count">2 items</span></div>
<details class="item-card" open data-item="website"><summary><span class="summary-text"><span class="item-name">Website design</span><span class="item-meta">1 service × £800.00 · tax 20%</span></span><span class="summary-total">£960.00</span><span class="editing">Editing</span><i class="expand-arrow" data-lucide="chevron-down"></i></summary><div class="item-body">
<div class="field"><label for="description-1">Description</label><textarea id="description-1">Website design and development</textarea></div>
<div class="fields"><div class="field"><label for="qty-1">Quantity</label><input id="qty-1" inputmode="decimal" value="1" aria-label="Website design quantity"></div><div class="field"><label for="unit-1">Unit</label><select id="unit-1"><option>Service</option><option>Item</option><option>Hours</option><option>Custom…</option></select></div><div class="field"><label for="price-1">Unit price</label><div class="money-input"><span>£</span><input id="price-1" inputmode="decimal" value="800.00" aria-label="Website design unit price in pounds"></div></div></div>
<div class="tax-total"><div class="field"><label for="tax-1">Tax</label><div class="tax-input"><input id="tax-1" inputmode="decimal" value="20" aria-label="Website design tax percentage"><span>%</span></div></div><div class="line-total"><span>Line total</span><strong>£960.00</strong></div></div><div class="item-tools"><button class="discount"><i data-lucide="tag"></i>Discount · 0%<i data-lucide="chevron-down"></i></button><button class="remove" aria-label="Remove Website design"><i data-lucide="trash-2"></i>Remove</button></div>
</div></details>
<details class="item-card" data-item="copy"><summary><span class="summary-text"><span class="item-name">Website copywriting</span><span class="item-meta">1 service × £200.00 · tax 20%</span></span><span class="summary-total">£240.00</span><span class="editing">Editing</span><i class="expand-arrow" data-lucide="chevron-down"></i></summary><div class="item-body"><div class="field"><label for="description-2">Description</label><textarea id="description-2">Copywriting for five website pages</textarea></div><div class="fields"><div class="field"><label for="qty-2">Quantity</label><input id="qty-2" inputmode="decimal" value="1" aria-label="Copywriting quantity"></div><div class="field"><label for="unit-2">Unit</label><select id="unit-2"><option>Service</option><option>Item</option><option>Hours</option><option>Custom…</option></select></div><div class="field"><label for="price-2">Unit price</label><div class="money-input"><span>£</span><input id="price-2" inputmode="decimal" value="200.00" aria-label="Copywriting unit price in pounds"></div></div></div><div class="tax-total"><div class="field"><label for="tax-2">Tax</label><div class="tax-input"><input id="tax-2" inputmode="decimal" value="20" aria-label="Copywriting tax percentage"><span>%</span></div></div><div class="line-total"><span>Line total</span><strong>£240.00</strong></div></div><div class="item-tools"><button class="discount"><i data-lucide="tag"></i>Discount · 0%<i data-lucide="chevron-down"></i></button><button class="remove" aria-label="Remove Website copywriting"><i data-lucide="trash-2"></i>Remove</button></div></div></details>
<div class="add-actions"><button class="add"><i data-lucide="plus"></i>Add item</button><button class="products"><i data-lucide="package"></i>Add from Products &amp; services</button></div>
<section class="totals" aria-label="Invoice item totals"><div class="total-row"><span>Subtotal</span><strong>£1,000.00</strong></div><div class="total-row"><span>Tax <small>added on top</small></span><strong>£200.00</strong></div><div class="total-row grand"><span>Total</span><strong>£1,200.00</strong></div></section>
</main><footer class="footer"><button class="done"><i data-lucide="check"></i>Done</button></footer></div>
<script>
// Isolated accordion behaviour only. No invoice changes or production integration.
document.querySelectorAll('.item-card').forEach(card => card.addEventListener('toggle', () => { if(card.open) document.querySelectorAll('.item-card').forEach(other => { if(other !== card) other.open = false; }); }));
</script></body></html>
