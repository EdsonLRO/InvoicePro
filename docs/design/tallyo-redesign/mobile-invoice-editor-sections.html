<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tallyo mobile invoice sections — design reference</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1e293b;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;background:none;border:0;cursor:default}svg{width:20px;height:20px;stroke-width:1.8;flex-shrink:0}button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}.app{width:100%;min-height:100dvh;display:flex;flex-direction:column}.topbar{height:62px;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}.brand{width:119px;height:50px;object-fit:contain;margin-left:-3px}.more{height:44px;min-width:69px;color:#cbd5e1;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;border-radius:8px}.more svg{width:18px;height:18px}.main{padding:18px 18px 17px;flex:1}.heading{display:flex;align-items:center;gap:10px;justify-content:space-between}h1{font-size:22px;font-weight:650;letter-spacing:-.65px}.draft{background:#fff;border:1px solid #dce3ee;color:#71809a;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:550}.saved{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:12px;color:#7e8ca1}.saved svg{height:13px;width:13px;color:#7d9990}.section-hint{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#7a8a9f;margin:17px 0 11px}.section-hint span{display:flex;align-items:center;gap:5px}.section-hint svg{width:13px;height:13px}.sections{display:flex;flex-direction:column;gap:8px}.edit-section{background:#fff;border:1px solid #dfe6ef;border-radius:10px;box-shadow:0 2px 3px #0f172a02;min-height:74px;width:100%;padding:11px 13px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:9px}.section-copy{flex:1;min-width:0}.section-label{font-size:10px;letter-spacing:.9px;font-weight:650;color:#8b98ac;display:block;margin-bottom:5px}.section-value{font-size:14px;font-weight:550;color:#3a4961;line-height:1.35;display:block}.section-secondary{display:block;font-size:12px;color:#7b8aa1;margin-top:4px;line-height:1.35}.section-arrow{height:18px;width:18px;color:#a0acc0}.split{display:flex;align-items:center;justify-content:space-between;gap:8px}.split strong{font-size:14px;font-weight:600;color:#43526b;font-variant-numeric:tabular-nums}.enabled-dot{display:inline-block;height:6px;width:6px;border-radius:50%;background:#58a383;margin-right:5px;vertical-align:middle}.edit-section.compact{min-height:66px}.total-card{background:#fff;border:1px solid #dfe6ef;border-radius:10px;padding:12px 13px;margin-top:13px}.total-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#67768c;line-height:1.4}.total-row strong{font-weight:600;color:#394860;font-variant-numeric:tabular-nums}.total-row+.total-row{margin-top:7px}.total-row.balance{border-top:1px solid #e8edf5;padding-top:9px;margin-top:9px;font-weight:600;color:#43526a}.total-row.balance strong{font-size:20px;font-weight:650;color:#4f46e5;letter-spacing:-.4px}.total-row small{font-size:11px;color:#929eaf;margin-left:5px}.actions{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1.65fr;align-items:center;gap:10px;padding:12px 18px 17px;height:79px;background:#fff;border-top:1px solid #dce3ee;box-shadow:0 -3px 12px #0f172a03;flex-shrink:0}.action{height:48px;border:1px solid #d9e1ed;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600}.action svg{width:17px;height:17px}.action.primary{background:#4f46e5;border-color:#4f46e5;color:white;box-shadow:0 2px 4px #4f46e51a}.sheet{position:fixed;inset:auto 10px 89px;background:#fff;border:1px solid #dfe6ef;box-shadow:0 10px 40px #0f172a33;border-radius:14px;padding:12px;z-index:10}.sheet[hidden]{display:none}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding-left:8px}.sheet-head h2{font-size:17px}.sheet-head button{height:44px;width:44px;display:grid;place-items:center}.sheet-row{height:48px;width:100%;text-align:left;border-top:1px solid #edf0f5;display:flex;align-items:center;gap:12px;padding:0 8px}.sheet-row svg{width:18px;height:18px;color:#8090a7}.sheet-row.danger{color:#b55959}@media(max-width:360px){.main{padding-inline:14px}.actions{padding-inline:14px}.section-value,.split strong{font-size:13px}h1{font-size:21px}}
</style></head><body><div class="app">
<header class="topbar"><img class="brand" src="../../../tallyo-wordmark-white.png" alt="Tallyo"><button class="more" id="more-button" aria-expanded="false" aria-controls="more-sheet">More<i data-lucide="ellipsis"></i></button></header>
<main class="main"><div class="heading"><h1>Invoice INV-1042</h1><span class="draft">Draft</span></div><p class="saved"><i data-lucide="circle-check"></i>Last saved just now</p><div class="section-hint"><span>Tap a section to edit</span><span><i data-lucide="check"></i>Ready to review</span></div>
<div class="sections" aria-label="Invoice editing sections">
<button class="edit-section" aria-label="Edit customer"><span class="section-copy"><span class="section-label">CUSTOMER</span><span class="section-value">Willow &amp; Pine Studio</span><span class="section-secondary">hello@willowandpine.co.uk</span></span><i class="section-arrow" data-lucide="chevron-right"></i></button>
<button class="edit-section" aria-label="Edit invoice details"><span class="section-copy"><span class="section-label">INVOICE DETAILS</span><span class="section-value">12 Sep 2026 → 26 Sep 2026</span><span class="section-secondary">GBP · PO-7781</span></span><i class="section-arrow" data-lucide="chevron-right"></i></button>
<button class="edit-section compact" aria-label="Edit 3 line items"><span class="section-copy"><span class="section-label">ITEMS</span><span class="split"><span class="section-value">3 items</span><strong>£1,250 subtotal</strong></span></span><i class="section-arrow" data-lucide="chevron-right"></i></button>
<button class="edit-section" aria-label="Edit payment terms and online payment"><span class="section-copy"><span class="section-label">PAYMENT</span><span class="section-value"><span class="enabled-dot"></span>Online payment enabled</span><span class="section-secondary">Full balance £1,500 · Net 14 days</span></span><i class="section-arrow" data-lucide="chevron-right"></i></button>
<button class="edit-section" aria-label="Edit recurring invoice and reminders"><span class="section-copy"><span class="section-label">AUTOMATION</span><span class="section-value">Recurring off</span><span class="section-secondary">Reminders on · Friendly · after 3 days</span></span><i class="section-arrow" data-lucide="chevron-right"></i></button>
<button class="edit-section compact" aria-label="Edit invoice notes"><span class="section-copy"><span class="section-label">NOTES</span><span class="section-value">Thank you for your business…</span></span><i class="section-arrow" data-lucide="chevron-right"></i></button>
</div>
<section class="total-card" aria-label="Invoice summary"><div class="total-row"><span>Total<small>incl. £250 tax</small></span><strong>£1,500</strong></div><div class="total-row"><span>Paid</span><strong>£0</strong></div><div class="total-row balance"><span>Balance</span><strong>£1,500</strong></div></section>
</main><footer class="actions" aria-label="Invoice actions"><button class="action"><i data-lucide="eye"></i>Preview</button><button class="action primary">Save &amp; send<i data-lucide="send"></i></button></footer></div>
<section class="sheet" id="more-sheet" aria-label="More invoice actions" hidden><div class="sheet-head"><h2>Invoice INV-1042</h2><button id="close-more" aria-label="Close More menu"><i data-lucide="x"></i></button></div><button class="sheet-row"><i data-lucide="copy"></i>Duplicate</button><button class="sheet-row"><i data-lucide="download"></i>Download PDF</button><button class="sheet-row danger"><i data-lucide="trash-2"></i>Delete draft</button></section>
<script>
// Menu preview only; no editing, saving, payment or sending implementation.
const moreButton = document.getElementById('more-button');
const moreSheet = document.getElementById('more-sheet');
moreButton.addEventListener('click', () => { moreSheet.hidden = false; moreButton.setAttribute('aria-expanded','true'); document.getElementById('close-more').focus(); });
function closeMore() { moreSheet.hidden = true; moreButton.setAttribute('aria-expanded','false'); moreButton.focus(); }
document.getElementById('close-more').addEventListener('click', closeMore);
document.addEventListener('keydown', event => { if(event.key === 'Escape' && !moreSheet.hidden) closeMore(); });
</script></body></html>
