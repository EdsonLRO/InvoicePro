dden}.document.overdue{border-color:#ebdcd4;border-left:3px solid #c88465}.record-open{display:block;padding:12px 14px;min-height:104px}.record-heading{display:flex;align-items:center;gap:9px;padding-right:37px;min-height:21px}.record-heading strong{font-size:14px;font-weight:650;letter-spacing:.1px}.doc-type{color:#8996aa;font-size:11px;display:inline-flex;align-items:center;gap:4px}.doc-type svg{height:12px;width:12px}.doc-type.quote{color:#7f73ae}.customer{display:block;font-size:14px;color:#687790;margin-top:4px}.money-status{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.amount{font-size:20px;font-weight:650;letter-spacing:-.4px;color:#334155;font-variant-numeric:tabular-nums}.status{display:inline-flex;align-items:center;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:650;letter-spacing:.3px;background:#edf1fd;color:#5e70b9}.status.late{background:#fff0e9;color:#b35a37}.status.paid{background:#eaf6ef;color:#337e62}.status.accepted{background:#eaf6ef;color:#337e62}.due{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#8290a4}.due .separator{color:#b3bdca}.due .late-copy{color:#b25c3e}.email{display:flex;align-items:center;gap:6px;color:#7a8b9f;margin-top:7px;font-size:12px}.email svg{height:13px;width:13px;color:#78948b}.overflow{position:absolute;right:3px;top:2px;width:44px;height:44px;display:grid;place-items:center;color:#93a0b4;border-radius:8px;z-index:2}.overflow svg{width:19px;height:19px}.bottom-nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr .8fr 1fr 1fr;align-items:center;height:76px;padding:7px 8px 10px;background:#fff;border-top:1px solid #dce3ee;flex-shrink:0;box-shadow:0 -3px 12px #0f172a03}.nav-item{height:52px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;color:#8793a7;font-size:11px;font-weight:500}.nav-item svg{width:21px;height:21px}.nav-item.active{color:#4f46e5;font-weight:650}.nav-new{width:46px;height:46px;border-radius:13px;background:#4f46e5;color:white;display:grid;place-items:center;justify-self:center;box-shadow:0 3px 6px #4f46e522}.nav-new svg{width:24px;height:24px;stroke-width:1.8}.sheet{position:fixed;inset:auto 10px 86px;background:#fff;border:1px solid #dfe6ef;box-shadow:0 10px 40px #0f172a33;border-radius:14px;padding:12px;z-index:10}.sheet[hidden]{display:none}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding-left:8px}.sheet-head h2{font-size:17px}.sheet-head button{height:44px;width:44px;display:grid;place-items:center}.sheet-row{display:flex;align-items:center;gap:12px;height:48px;width:100%;text-align:left;border-top:1px solid #edf0f5;padding-inline:8px;font-size:14px}.sheet-row svg{color:#7585a1;width:18px;height:18px}.empty{padding:25px 12px;text-align:center;color:#7c8ba0;font-size:14px}.empty[hidden]{display:none}@media(max-width:360px){.main{padding-inline:14px}.filter{font-size:11px}}

</style></head><body><div class="app"><header class="topbar"><img class="brand" src="../../../tallyo-wordmark-white.png" alt="Tallyo"><button class="activity-button" aria-label="View recent activity"><i data-lucide="bell"></i></button></header>

<div class="records">
<article class="document overdue" data-status="overdue" data-id="INV-1042"><a class="record-open" href="#invoice-1042" aria-label="Open invoice INV-1042 for Willow and Pine Studio"><span class="record-heading"><strong>INV-1042</strong><span class="doc-type"><i data-lucide="file-text"></i>Invoice</span></span><span class="customer">Willow &amp; Pine Studio</span><span class="money-status"><strong class="amount">£320.00</strong><span class="status late">OVERDUE</span></span><span class="due"><span>Due 3 Sep</span><span class="separator">·</span><span class="late-copy">8 days overdue</span></span><span class="email"><i data-lucide="mail-check"></i>Email delivered</span></a><button class="overflow" aria-label="More actions for INV-1042"><i data-lucide="ellipsis"></i></button></article>

<script>
// Demo data only. Local filtering and menu previews; no app/provider integration.
const records = [...document.querySelectorAll('.document')];
let selectedStatus = 'all'; let lastTrigger;
function filterRecords() { const query = document.getElementById('search').value.trim().toLowerCase(); let count = 0; records.forEach(record => { const shown = (selectedStatus === 'all' || record.dataset.status === selectedStatus) && record.textContent.toLowerCase().includes(query); record.hidden = !shown; record.style.display = shown ? '' : 'none'; if (shown) count++; }); document.getElementById('result-count').textContent = count + (count === 1 ? ' document' : ' documents'); document.querySelector('.empty').hidden = count !== 0; }
document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { selectedStatus = button.dataset.status; document.querySelectorAll('.filter').forEach(item => { item.classList.toggle('active', item === button); item.setAttribute('aria-pressed', String(item === button)); }); filterRecords(); }));
document.getElementById('search').addEventListener('input', filterRecords);
function openSheet(id, trigger) { document.querySelectorAll('.sheet').forEach(sheet => sheet.hidden = true); const sheet = document.getElementById(id); sheet.hidden = false; lastTrigger = trigger; trigger.setAttribute('aria-expanded', 'true'); sheet.querySelector('.close-sheet').focus(); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(sheet => sheet.hidden = true); if (lastTrigger) { lastTrigger.setAttribute('aria-expanded', 'false'); lastTrigger.focus(); } }
document.getElementById('new-button').addEventListener('click', event => openSheet('new-sheet', event.currentTarget));
document.querySelectorAll('.overflow').forEach(button => button.addEventListener('click', () => { document.getElementById('actions-title').textContent = button.closest('.document').dataset.id; openSheet('actions-sheet', button); }));
document.querySelectorAll('.close-sheet').forEach(button => button.addEventListener('click', closeSheets));
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSheets(); });
</script></body></html>
